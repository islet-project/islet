[package]
name = "key-derivation"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
sha2 = { version = "0.10", default-features = false, features = ["oid"]}
aes = "0.8"
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "pem"] }
p384 = { version = "0.14", default-features = false, features = ["arithmetic", "pem"] }
elliptic-curve = { version = "0.14", features = ["arithmetic"] }
hkdf = "0.12"
